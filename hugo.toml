baseURL = 'https://poytaytoy.github.io/'
locale = 'en-US'
title = "clement chung"
theme = 'PaperMod'
enableRobotsTXT = true

[pagination]
pagerSize = 10

[params]
env = 'production'
description = 'Clement Chung’s personal notebook: projects, experiments, and things I learn.'
author = 'Clement'
defaultTheme = 'auto'
ShowReadingTime = true
ShowCodeCopyButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowToc = true
mainSections = ['posts']

[params.profileMode]
enabled = true
imageUrl = "https://avatars.githubusercontent.com/u/122646162?v=4"
imageTitle = "Clement’s GitHub avatar"
imageWidth = 120
imageHeight = 120

[params.assets]
favicon = 'https://avatars.githubusercontent.com/u/122646162?v=4&s=64'
favicon16x16 = 'https://avatars.githubusercontent.com/u/122646162?v=4&s=16'
favicon32x32 = 'https://avatars.githubusercontent.com/u/122646162?v=4&s=32'
apple_touch_icon = 'https://avatars.githubusercontent.com/u/122646162?v=4&s=180'

[[params.socialIcons]]
name = 'github'
url = 'https://github.com/poytaytoy'
[[params.socialIcons]]
name = 'linkedin'
url = 'https://www.linkedin.com/in/clement-chung-36b9082b6/'
[[params.socialIcons]]
name = 'email'
url = 'mailto:c58chung@uwaterloo.ca'
[[menu.main]]
name = 'home'
url = '/'
weight = -10

[[menu.main]]
name = 'posts'
url = '/posts/'
weight = 10
[[menu.main]]
name = 'projects'
url = '/projects/'
weight = 20
[[menu.main]]
name = 'about'
url = '/about/'
weight = 30

[[menu.main]]
name = 'resume'
url = '/resume.pdf'
weight = 40

[markup.highlight]
noClasses = false

[caches.images]
dir = ':cacheDir/images'

[markup.goldmark.renderer]
unsafe = true
